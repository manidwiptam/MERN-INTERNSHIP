<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANIDWIPTAM</title>
    <link rel="icon" href="../../Assets/images/icon.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>

<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

</head>
<body>
    <script src="script.js" defer></script>
    
    <header class="bg-blue-900 w-full h-10 sticky w-full flex gap-4 items-center px-8 py-2">
        <i class="fa-solid fa-phone text-white"></i>
        <p class="text-white">New Course Enqury : </p>
        <img src="../../Assets/images/flag.jpg" alt="Indian flag" class="w-6 h-4">
        <p class="text-white">+91 7679200617</p>                                         
        
    </header>

    <nav  class="flex py-2">
        <div class="py-2 px-4">
            <img width="150" height="43" src="https://www.edureka.co/img/Edureka_SNVA_New1_Ver_Logo.webp" 
            alt="Edureka Veranda logo" title="Edureka Veranda logo" decoding="async" loading="eager" fetchpriority="high">
        </div>
        <div class="flex item center border-1 rounded border-blue-800 w-fit h-10 px-3 py-1">
            <p>Catagories</p>
                <i class="fa-solid fa-square-caret-down py-1"></i>
        </div>
        <div class="pl-4">
            <div class="w-100 h-fit border-1 border-blue-800 rounded-3xl px-2 py-2 gap-4">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="bg-white-300 outline-none"
                placeholder="Search courses">
            </div>
        </div>
        <div class="pl-80">
            <p>All Courses</p>
        </div>
        <div class="pl-5">
            <p>Corporate Training</p>
        </div>
        <div class="pl-5">
            <p>Resources</p>
        </div>
        <div class="pl-3">
            <div class="flex item center border-1 rounded border-blue-800 w-fit h-10 px-3 py-1">
                <p>Sign up</p>
            </div>
        </div>
        <div class="pl-3">
            <div class="item center border-1 rounded border-blue-800 w-fit h-10 px-3 py-1">
                <p>Log in</p>
            </div>
        </div>
    </nav>

    <section class="flex px-3">
        <div class="flex item center border-0 rounded border-white-800 w-fit h-10 px-3 py-1">
            <div style="font-family: sans-serif; font-size: 16px;">
                Browse <br> 
            <strong>Courses</strong>
            </div>
                <i class="fa-solid fa-square-caret-down py-7"></i>
        </div>
        <div class="pl-10">
            <p>Corporate Training</p>
        </div>
        <div class="pl-10">
            <p>Corporate Training</p>
        </div>
        <div class="pl-10">
            <p>Corporate Training</p>
        </div>
        <div class="pl-10">
            <p>Corporate Training</p>
        </div>
        <div class="pl-10">
            <p>Corporate Training</p>
        </div>
        <div class="pl-10">
            <p>Corporate Training</p>
        </div>
        <div class="pl-10">
            <p>Corporate Training</p>
        </div>
        <div class="pl-10">
            <p>Corporate Training</p>
        </div>
        <div class="pl-10">
            <p></p>
             <i class="fa-solid fa-bars"></i>
        </div>
    </section>

    <section class="py-4 flex">
        <!-- Slider main container -->
        <div class="swiper">
        <!-- Additional required wrapper -->
        <div class="swiper-wrapper">
            <!-- Slides -->
            <div class="swiper-slide">
                <img src="../../Assets/images/1772462006-BANNER 1 (2) (1).webp">
            </div>
            <div class="swiper-slide">
                <img src="../../Assets/images/1781762575-Gen-AI-&-ML-Banner-Web.webp">
            </div>
            <div class="swiper-slide">
                <img src="../../Assets/images/1786370617-Advanced-Certification-in-AI-Product-Management_web (1).webp">
            </div>
            <div class="swiper-slide">
                <img src="../../Assets/images/1786371595-Advanced-Certification-in-Data-Engineering-with-GenAI_Web (2).webp">
            </div>
        </div>
        <!-- If we need pagination -->
        <div class="swiper-pagination"></div>
        <!-- If we need navigation buttons -->
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
        <!-- If we need scrollbar -->
        <div class="swiper-scrollbar"></div>
        </div>
    </section>

</body>
</html>
