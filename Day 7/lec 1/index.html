<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MANIDWIPTAM</title>

    <link rel="icon" href="../../Packages/icon.jpg">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =================================
         PROFILE CARD
    ================================== -->

    <div class="profile-card">


        <!-- =================================
             BLUE HEADER
        ================================== -->

        <div class="profile-header"></div>


        <!-- =================================
             PROFILE PICTURE
        ================================== -->

        <div class="profile-picture">

            <img
                src="../../Packages/pfp.jpg"
                alt="Profile Picture"
            >

        </div>


        <!-- =================================
             PROFILE CONTENT
        ================================== -->

        <div class="profile-content">


            <!-- Title -->

            <h1>
                Software Developer
            </h1>


            <!-- Subtitle -->

            <p class="subtitle">
                Open Source Contributor
            </p>


            <!-- =================================
                 SOCIAL LINKS
            ================================== -->

            <div class="social-links">


                <!-- LinkedIn -->

                <a
                    href="https://www.linkedin.com/in/manidwiptam/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="linkedin"
                    aria-label="LinkedIn"
                >

                    <i class="fa-brands fa-linkedin-in"></i>

                </a>


                <!-- GitHub -->

                <a
                    href="https://github.com/Manidwiptam"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="github"
                    aria-label="GitHub"
                >

                    <i class="fa-brands fa-github"></i>

                </a>


                <!-- Email -->

                <a
                    href="mailto:your-email@example.com"
                    class="email"
                    aria-label="Email"
                >

                    <i class="fa-regular fa-envelope"></i>

                </a>


            </div>


            <!-- =================================
                 MESSAGE BUTTON
            ================================== -->

            <a
                href="mailto:your-email@example.com"
                class="message-button"
            >
                Message
            </a>


        </div>

    </div>


</body>

</html>
